<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bricked Up! '88 Embed Demo</title>
    <script type="module" src="./bricked-up-88.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255, 119, 0, 0.2), transparent 35%),
          linear-gradient(180deg, #1b1037 0%, #070b14 100%);
        color: #f8fafc;
      }

      main {
        width: min(100%, 1100px);
        padding: 32px 20px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 12px;
        text-align: center;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0 0 24px;
        text-align: center;
        font-size: 1.05rem;
      }

      bricked-up-88 {
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bricked Up! '88</h1>
      <p>Portable web component demo. Drop the built folder anywhere and embed the tag.</p>
      <bricked-up-88 title="Bricked Up! '88"></bricked-up-88>
    </main>
  </body>
</html>
